[package]
name = "tide-sdl"
version.workspace = true
edition.workspace = true

[[bin]]
name = "tide-tv"
path = "src/main.rs"

[features]
tidlers = ["tide-api/tidlers"]

[dependencies]
tide-core = { path = "../tide-core" }
tide-gfx = { path = "../tide-gfx" }
tide-api = { path = "../tide-api" }
tide-player = { path = "../tide-player" }
tide-img = { path = "../tide-img" }
sdl2 = "0.36"
glow = "0.13"
png = "0.17"
