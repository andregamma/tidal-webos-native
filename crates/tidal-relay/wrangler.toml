name = "tidal-relay"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

[build]
command = "cargo install -q worker-build && worker-build --release"

[observability]
enabled = true

# The only host allowed to answer the service's redirect. `wrangler deploy` creates the DNS record
# for the zone that owns this name.
[[routes]]
pattern = "tidal-relay.andregama.dev"
custom_domain = true

[durable_objects]
bindings = [{ name = "HANDOFFS", class_name = "HandoffStore" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HandoffStore"]

[vars]
# All of this is optional: the TV names its own client and redirect in `POST /v1/handoff`, and the app
# signs in with the client `tidlers` embeds (whose redirect is the service's own page), so the paste
# page does the rest. Set these only for a client whose registered redirect is this relay's `/callback`,
# i.e. one where the code comes back automatically and no pasting is needed.
#
# `TIDAL_CLIENT_ID` is public (it ends up in the authorize URL), but it must be exactly the client the
# TV signs in with. Local: `crates/tidal-relay/.dev.vars` (git-ignored). Deployed:
# `wrangler secret put TIDAL_CLIENT_ID`. The secret half is never needed here: the relay does not talk
# to the token endpoint at all.
#
# Must be registered as a redirect URI for that client, exactly as written.
REDIRECT_URI = "https://tidal-relay.andregama.dev/callback"
TIDAL_AUTHORIZE_URL = "https://login.tidal.com/authorize"
# Empty = do not send `scope` on the authorize request, which is what the TV's client does.
TIDAL_SCOPE = ""
# Only for local work: the address the phone should open for `/auth/<id>` and `/paste/<id>`. `wrangler dev`
# reports the custom domain above with an `http` scheme, which a phone cannot reach. Leave it out when
# deployed (the request's own origin is used) and set it in `.dev.vars` to e.g. `http://127.0.0.1:8787`.
# PUBLIC_BASE = "http://127.0.0.1:8787"

