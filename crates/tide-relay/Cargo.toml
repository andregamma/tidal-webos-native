[package]
name = "tide-relay"
version = "0.1.0"
edition = "2021"
publish = false
description = "The PKCE redirect relay of the TV client, as a Cloudflare Worker"

# Its own workspace: this crate targets wasm32-unknown-unknown, and keeping it out of the TV
# workspace is what lets `cargo test --workspace` there stay a host-only build.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Only the Worker build needs these: the pure protocol in `protocol.rs` is tested on the host.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.8.7"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Crypto"] }

[profile.release]
opt-level = "s"
lto = true
# No `strip`: worker-build runs wasm-opt on the wasm-bindgen output, and stripping the
# `target_features` section first makes wasm-bindgen guess which Wasm features to use.
