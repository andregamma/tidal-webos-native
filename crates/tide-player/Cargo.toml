[package]
name = "tide-player"
version.workspace = true
edition.workspace = true

[dependencies]
tide-core = { path = "../tide-core" }
ureq = "2"
# Pure-Rust decoders. FLAC + AAC (M4A/MP4, also DASH fragments) are what the service serves;
# wav/pcm are only for local testing with --play-url.
symphonia = { version = "0.5", default-features = false, features = ["flac", "aac", "isomp4", "mp3", "wav", "pcm"] }
