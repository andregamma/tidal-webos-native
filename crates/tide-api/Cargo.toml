[package]
name = "tide-api"
version.workspace = true
edition.workspace = true

[features]
# Proof of concept: backend built on the `tidlers` crate (see docs/tidlers-poc.md).
tidlers = ["dep:tidlers", "dep:tokio", "dep:http"]

[dependencies]
tide-core = { path = "../tide-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tidlers = { version = "=0.5.0", optional = true }
tokio = { version = "1", features = ["rt", "time", "net"], optional = true }
# Same crate `tidlers`/`reqwest` already use; only for `Method`/`HeaderMap` in the raw Home request.
http = { version = "1", optional = true }
