[package]
name = "tidal-api"
version.workspace = true
edition.workspace = true

[dependencies]
tidal-core = { path = "../tidal-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tidlers = { version = "=0.5.0" }
tokio = { version = "1", features = ["rt", "time", "net"] }
# Same crate `tidlers`/`reqwest` already use; only for `Method`/`HeaderMap` in the raw Home request.
http = "1"
# 32 random bytes for the PKCE `state` (already in the lock through `tidlers`/`rand`).
getrandom = "0.4"
# The sign-in relay is plain HTTPS (see crates/tidal-relay). No TLS features of its own: `tidlers`
# already builds reqwest with its backend, and features are unified across the graph.
reqwest = { version = "0.13", default-features = false }
