[workspace]
resolver = "2"
members = [
    "crates/tide-core",
    "crates/tide-gfx",
    "crates/tide-img",
    "crates/tide-player",
    "crates/tide-api",
    "crates/tide-sdl",
]
# The sign-in relay is a Cloudflare Worker with its own (wasm) workspace: host builds here must not
# try to compile it. See `docs/relay.md`.
exclude = ["crates/tide-relay"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
